version: 0.2

env:
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    BUILD_CONFIGURATION: "Release"

phases:
  install:
    runtime-versions:
      dotnet: 8.0
    commands:
      - dotnet tool install -g dotnet-reportgenerator-globaltool
      - export PATH="$PATH:$HOME/.dotnet/tools"

  pre_build:
    commands:
      - pwd
      - find . -maxdepth 3 \( -name "*.sln" -o -name "*.csproj" \) -not -path '*/.git*'
      # Solution (first .sln found)
      - export SLN_PATH=$(find . -maxdepth 3 -name "*.sln" | head -n 1)
      - echo "Solution $SLN_PATH"
      - test -n "$SLN_PATH"
      # Web project = the csproj that uses the Web SDK (excludes test projects)
      - export APP_PROJECT=$(grep -rl --include=*.csproj 'Microsoft.NET.Sdk.Web' . | grep -vi 'test' | head -n 1)
      - echo "Web project $APP_PROJECT"
      - test -n "$APP_PROJECT"
      - dotnet restore "$SLN_PATH"

  build:
    commands:
      - dotnet build "$SLN_PATH" --configuration $BUILD_CONFIGURATION --no-restore
      - >
        dotnet test "$SLN_PATH"
        --configuration $BUILD_CONFIGURATION
        --no-build
        --logger "trx;LogFileName=results.trx"
        --collect:"XPlat Code Coverage"
        --results-directory "$CODEBUILD_SRC_DIR/TestResults"

  post_build:
    commands:
      - export PATH="$PATH:$HOME/.dotnet/tools"
      - echo "Files produced by tests:"
      - find "$CODEBUILD_SRC_DIR/TestResults" -type f || true
      - mkdir -p "$CODEBUILD_SRC_DIR/CoverageReport"
      - |
        if find "$CODEBUILD_SRC_DIR/TestResults" -name "coverage.cobertura.xml" 2>/dev/null | grep -q .; then
          reportgenerator \
            -reports:"$CODEBUILD_SRC_DIR/TestResults/**/coverage.cobertura.xml" \
            -targetdir:"$CODEBUILD_SRC_DIR/CoverageReport" \
            -reporttypes:"Html;Cobertura;TextSummary"
          cat "$CODEBUILD_SRC_DIR/CoverageReport/Summary.txt"
        else
          echo "WARNING: no coverage files found, skipping coverage report"
        fi
      - mkdir -p "$CODEBUILD_SRC_DIR/artifacts-out/app"
      - >
        dotnet publish "$APP_PROJECT"
        --configuration $BUILD_CONFIGURATION
        --no-restore
        --output "$CODEBUILD_SRC_DIR/artifacts-out/app"
      - cp "$CODEBUILD_SRC_DIR/appspec.yml" "$CODEBUILD_SRC_DIR/artifacts-out/"
      - cp -r "$CODEBUILD_SRC_DIR/scripts" "$CODEBUILD_SRC_DIR/artifacts-out/scripts"
      - cp -r "$CODEBUILD_SRC_DIR/CoverageReport" "$CODEBUILD_SRC_DIR/artifacts-out/coverage-html"

reports:
  test-results:
    files:
      - '**/*.trx'
    base-directory: TestResults
    file-format: VisualStudioTrx
  code-coverage:
    files:
      - 'Cobertura.xml'
    base-directory: CoverageReport
    file-format: CoberturaXml

artifacts:
  files:
    - '**/*'
  base-directory: artifacts-out
  name: agenticpitstop-build

cache:
  paths:
    - '/root/.nuget/packages/**/*'