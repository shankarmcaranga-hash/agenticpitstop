version: 0.2

phases:
  install:
    runtime-versions:
      dotnet: 8.0
    commands:
      - dotnet tool install -g dotnet-reportgenerator-globaltool
      - export PATH="$PATH:/root/.dotnet/tools"

  pre_build:
      commands:
        - echo "Current Directory"
        - pwd
        - echo "Listing Files"
        - find .
        - cd AgenticPITSTOP
        - ls -la
        - dotnet --info
        - dotnet restore AgenticPitstop.sln --verbosity normal

  build:
    commands:
      - dotnet build AgenticPitstop.sln --configuration Release --no-restore

  post_build:
    commands:
      - dotnet test AgenticPitstop.Tests/AgenticPitstop.Tests.csproj --logger trx

artifacts:
  files:
    - '**/*'
