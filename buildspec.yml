version: 0.2

env:
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"

phases:
  install:
    runtime-versions:
      dotnet: 8.0
    commands:
      - dotnet tool install -g dotnet-reportgenerator-globaltool
      - export PATH="$PATH:$HOME/.dotnet/tools"

  pre_build:
    commands:
      - pwd
      - find . -maxdepth 3 \( -name "*.sln" -o -name "*.csproj" \) -not -path '*/.git*'
      - export SLN_PATH=$(find . -maxdepth 3 -name "*.sln" | head -n 1)
      - echo "Using solution $SLN_PATH"
      - test -n "$SLN_PATH"
      - dotnet restore "$SLN_PATH" --verbosity normal

  build:
    commands:
      - dotnet build "$SLN_PATH" --configuration Release --no-restore
      - dotnet test "$SLN_PATH" --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory "$CODEBUILD_SRC_DIR/TestResults"

reports:
  test-results:
    files:
      - 'results.trx'
    base-directory: TestResults
    file-format: VisualStudioTrx

artifacts:
  files:
    - '**/*'
